version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /tests
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      teste: { patterns: ["*"] }
    ignore:
      # versiunile bibliotecilor din aplicație sunt fixate prin amprente SHA-384; se actualizează manual
      - dependency-name: pdfjs-dist
      - dependency-name: tesseract.js
      - dependency-name: tesseract.js-core
      - dependency-name: "@tesseract.js-data/ron"
