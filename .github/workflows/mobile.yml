name: Mobil (simulator iOS și emulator Android)

on:
  push:
    branches: [main]
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Safari în simulatorul iOS
    runs-on: macos-latest
    timeout-minutes: 45
    # informativ: simulatorul iOS pe runner-ele GitHub este lent și uneori instabil
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: node prepare.js
        working-directory: tests
      - name: Rulează în Safari iOS
        env:
          SOFT_FAIL: "export|blob de export|coadă" # simulatorul nu are encoder video hardware
        run: bash tests/ios-sim.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rezultate-ios-simulator
          path: tests/results
          if-no-files-found: ignore
          retention-days: 14

  android-emulator:
    name: Chrome în emulatorul Android (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: node prepare.js
        working-directory: tests
      - name: Activează KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rulează în Chrome Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: SOFT_FAIL='export|blob de export|coadă' bash tests/android-run.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rezultate-android-api${{ matrix.api }}
          path: tests/results
          if-no-files-found: ignore
          retention-days: 14
