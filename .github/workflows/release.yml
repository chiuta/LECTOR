name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Eticheta ediției (ex. v14)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/check.js
      - name: Pachet PWA
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="$(basename "$GITHUB_REPOSITORY")-pwa-${TAG}"
          mkdir "$NAME"
          cp index.html sw.js manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png README.md "$NAME"/
          zip -r "${NAME}.zip" "$NAME"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
      - name: Publică ediția
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$ZIP" --generate-notes --title "$TAG" || gh release upload "$TAG" "$ZIP" --clobber
